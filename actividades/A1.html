<DOCTYPE html>
    <head>
        <meta charset="utf-8">
        <title> Mi primera pagina</title>
        <style> 
            body{
                background-color: #f8f3e0;
                text-align: center;
                color:#5c0015;
            }
            h1{
                background-color: #81aee9;
                
            }

            p{
                color: #81aee9;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                font-size: 20px;
            }


        .arriba {
        width: 92%;
        margin: auto;

        height: 50px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        border-bottom: 1px dotted #7897aa;
        }
        
        .arriba nav {
            font-family: 'Courier New', Courier, monospace;
        display: flex;
        gap: 10px;
        }

        .arriba nav a {
        font-size: 15px;

        padding: 5px ;

        transition: .2s;
        }

        a {
  text-decoration: none;
}

         .arriba nav a:hover {
        border-bottom: 2px solid #6d9dca;
        }
        a:visited {
        color: #81aee9; /* Cambia el color del enlace visitado */
        text-decoration: none;
        }
        a:hover {
        color: #81aee9; /* Cambia el color del enlace cuando el cursor pasa por encima */
        }
        a:active {
        color: #81aee9; /* Cambia el color del enlace activo (cuando se hace clic) */
        }

        </style>
    </head>
    <body>
        <header class="arriba">

            <div class="nombre">
                J N H
            </div>

            <nav>
                 <a href="#" id="inicio" >INICIO</a>
                 <a href="#" id="anterior">ANTERIOR</a>
                <a href="#" id="siguiente" >SIGUIENTE</a>
                
                
                <a href="#"id="ultimo" >ULTIMO</a>
            </nav>

        </header>

            <li><a href="https://github.com/JazJaz-beep?tab=repositories">mi github</a></li>
        </ol>

        <script src="../js/navegacion.js"></script>

    </body>
    </html>
