
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi Paint</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 25px 15px;
        background: #dce8f2;
        color: #414b57;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        margin: 0 0 8px;
        color: #4776a8;
        font-size: 32px;
    }

    .subtitulo {
        margin-bottom: 20px;
        color: #667788;
    }

    .panel {
        max-width: 1150px;
        margin: auto;
        padding: 18px;
        background: #f1f3f4;
        border: 2px solid #ffffff;
        outline: 1px solid #a8b4c0;
    }

    .etiqueta {
        display: block;
        margin-bottom: 12px;
        font-weight: bold;
        color: #435a70;
    }

    /* Distribución de las tres columnas */

    .distribucion {
        display: grid;
        grid-template-columns: 110px minmax(0, 1fr) 180px;
        gap: 15px;
        align-items: start;
    }

    .lateral {
        min-width: 0;
        padding: 10px;
        background: #e9edf1;
        border: 1px solid #b5c0ca;
    }

    .zona-dibujo {
        min-width: 0;
    }

    .zona-dibujo > .etiqueta {
        text-align: left;
    }

    /* Colores */

    .colores {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
    }

    .color {
        width: 100%;
        aspect-ratio: 1;
        padding: 0;
        border: 2px solid white;
        outline: 1px solid #a5adb5;
        border-radius: 2px;
        cursor: pointer;
    }

    .color:hover {
        outline: 2px solid #4776a8;
    }

    .color.activo {
        outline: 3px solid #4776a8;
    }

    /* Botones */

    .herramientas {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 20px;
    }

    .herramientas button {
        width: 100%;
        padding: 9px 5px;
        background: #e3eaf0;
        color: #34485b;
        border: 1px solid #9eabb8;
        border-radius: 3px;
        font: 13px Arial, sans-serif;
        cursor: pointer;
    }

    .herramientas button:hover {
        background: #d3e3f3;
    }

    .herramientas button:active {
        background: #c5d6e8;
    }

    #eraser {
        background: #f0e3e8;
    }

    #clear {
        background: #e4eaf0;
    }

    #pintarTodo {
        background: #dcebe0;
    }

    /* Deslizadores */

    .controles {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin: 10px 0;
    }

    .control {
        min-width: 0;
        text-align: left;
    }

    .control label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        font-size: 12px;
    }

    .control input {
        width: 100%;
        accent-color: #648bb5;
        cursor: pointer;
    }

    .control span {
        display: block;
        margin-top: 4px;
        font-size: 12px;
        text-align: right;
    }

    /* Lienzo */

    .lienzo-contenedor {
        width: 100%;
        overflow: hidden;
        border: 2px solid #a5adb5;
        background: white;
        line-height: 0;
    }

    canvas {
        display: block;
        width: 100%;
        height: auto;
        background: white;
        cursor: crosshair;
        touch-action: none;
    }

    .ayuda {
        margin: 12px 0 0;
        color: #6b7885;
        font-size: 12px;
    }

    /* Pantallas pequeñas */

    @media (max-width: 760px) {
        body {
            padding: 15px 8px;
        }

        .panel {
            padding: 12px 8px;
        }

        .distribucion {
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .colores {
            grid-template-columns: repeat(5, minmax(0, 1fr));
        }

        .herramientas {
            flex-direction: row;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .herramientas button {
            flex: 1 1 120px;
            width: auto;
        }

        .controles {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
    }

    @media (max-width: 400px) {
        .controles {
            grid-template-columns: 1fr;
        }
    }
</style>

</head>

<body>
    <h1>Paint pirata</h1>
    <p class="subtitulo">A6 - Paint App personalizado</p>

    <main class="panel">

        <div class="distribucion">

            <!-- Colores a la izquierda -->
            <aside class="lateral">
                <span class="etiqueta">Colores</span>

                <div class="colores" id="colores">
                    <button class="color activo" type="button"
                        data-color="#55465a" style="background:#55465a"
                        aria-label="Morado oscuro" title="Morado oscuro"></button>

                    <button class="color" type="button"
                        data-color="#ff8fab" style="background:#ff8fab"
                        aria-label="Rosa" title="Rosa"></button>

                    <button class="color" type="button"
                        data-color="#ffb86b" style="background:#ffb86b"
                        aria-label="Durazno" title="Durazno"></button>

                    <button class="color" type="button"
                        data-color="#ffdf7e" style="background:#ffdf7e"
                        aria-label="Amarillo" title="Amarillo"></button>

                    <button class="color" type="button"
                        data-color="#8acb88" style="background:#8acb88"
                        aria-label="Verde" title="Verde"></button>

                    <button class="color" type="button"
                        data-color="#79c9d5" style="background:#79c9d5"
                        aria-label="Turquesa" title="Turquesa"></button>

                    <button class="color" type="button"
                        data-color="#83a7f5" style="background:#83a7f5"
                        aria-label="Azul" title="Azul"></button>

                    <button class="color" type="button"
                        data-color="#b69af5" style="background:#b69af5"
                        aria-label="Lila" title="Lila"></button>

                    <button class="color" type="button"
                        data-color="#a47762" style="background:#a47762"
                        aria-label="Café" title="Café"></button>

                    <button class="color" type="button"
                        data-color="#ffffff" style="background:#ffffff"
                        aria-label="Blanco" title="Blanco"></button>
                </div>
            </aside>

            <!-- Lienzo al centro -->
            <section class="zona-dibujo">
              

                <div class="lienzo-contenedor">
                    <canvas id="canvas" width="1000" height="700"
                        aria-label="Lienzo para dibujar"></canvas>
                </div>

                <p class="ayuda">Haz clic y arrastra para dibujar.</p>
            </section>

            <!-- Herramientas a la derecha -->
            <aside class="lateral">
                <span class="etiqueta">Herramientas</span>

                <div class="herramientas">
                    <button id="pincel" type="button">Pincel</button>
                    <button id="eraser" type="button">Borrador</button>
                    <button id="pintarTodo" type="button">Pintar fondo</button>
                    <button id="clear" type="button">Borrar todo</button>
                </div>

                <div class="controles">
                    <div class="control">
                        <label for="tamano">Tamaño del pincel</label>
                        <input type="range" id="tamano"
                            min="1" max="40" value="5">
                        <span id="valorGrosor">5 px</span>
                    </div>

                    <div class="control">
                        <label for="nivelOpacidad">Opacidad</label>
                        <input type="range" id="nivelOpacidad"
                            min="10" max="100" value="100">
                        <span id="valorOpacidad">100%</span>
                    </div>
                </div>
            </aside>

        </div>
    </main>

    <script>
    window.addEventListener('DOMContentLoaded', function () {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const capaBase = document.createElement('canvas');
        capaBase.width = canvas.width;
        capaBase.height = canvas.height;
        const base = capaBase.getContext('2d');

        const capaTrazo = document.createElement('canvas');
        capaTrazo.width = canvas.width;
        capaTrazo.height = canvas.height;
        const trazo = capaTrazo.getContext('2d');

        const colores = document.getElementById('colores');
        const tamano = document.getElementById('tamano');
        const valorGrosor = document.getElementById('valorGrosor');
        const nivelOpacidad = document.getElementById('nivelOpacidad');
        const valorOpacidad = document.getElementById('valorOpacidad');
        const eraserButton = document.getElementById('eraser');
        const clearButton = document.getElementById('clear');
        const pintarTodo = document.getElementById('pintarTodo');
        const pincelButton = document.getElementById('pincel');

        let colorActual = '#55465a';
        let usandoBorrador = false;
        let dibujando = false;
        let puntos = [];
        let colorFondo = '#ffffff';

        function obtenerPunto(event) {
            const rect = canvas.getBoundingClientRect();

            return {
                x: (event.clientX - rect.left) *
                    (canvas.width / rect.width),
                y: (event.clientY - rect.top) *
                    (canvas.height / rect.height)
            };
        }

        function actualizarLienzo() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = colorFondo;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.drawImage(capaBase, 0, 0);
            ctx.drawImage(capaTrazo, 0, 0);
        }

        function actualizarTrazo() {
            trazo.clearRect(0, 0, canvas.width, canvas.height);

            if (puntos.length === 0) {
                actualizarLienzo();
                return;
            }

            trazo.save();
            trazo.beginPath();

            trazo.globalAlpha = usandoBorrador
                ? 1
                : Number(nivelOpacidad.value) / 100;

            trazo.fillStyle = usandoBorrador
                ? colorFondo
                : colorActual;

            trazo.strokeStyle = usandoBorrador
                ? colorFondo
                : colorActual;

            if (puntos.length === 1) {
                trazo.arc(
                    puntos[0].x,
                    puntos[0].y,
                    Number(tamano.value) / 2,
                    0,
                    Math.PI * 2
                );

                trazo.fill();
            } else {
                trazo.moveTo(puntos[0].x, puntos[0].y);

                for (let i = 1; i < puntos.length; i++) {
                    trazo.lineTo(puntos[i].x, puntos[i].y);
                }

                trazo.lineWidth = Number(tamano.value);
                trazo.lineCap = 'round';
                trazo.lineJoin = 'round';
                trazo.stroke();
            }

            trazo.restore();
            actualizarLienzo();
        }

        function terminarTrazo() {
            if (!dibujando) return;

            dibujando = false;

            base.save();
            base.globalAlpha = 1;
            base.globalCompositeOperation = 'source-over';
            base.drawImage(capaTrazo, 0, 0);
            base.restore();

            trazo.clearRect(0, 0, canvas.width, canvas.height);
            puntos = [];

            actualizarLienzo();
        }

        function activarPincel() {
            usandoBorrador = false;
            pincelButton.style.fontWeight = 'bold';
            eraserButton.style.fontWeight = 'normal';
            canvas.style.cursor = 'crosshair';
        }

        canvas.addEventListener('pointerdown', function (event) {
            if (event.button !== undefined && event.button !== 0) {
                return;
            }

            dibujando = true;

            if (canvas.setPointerCapture) {
                canvas.setPointerCapture(event.pointerId);
            }

            puntos = [obtenerPunto(event)];
            actualizarTrazo();
            event.preventDefault();
        });

        canvas.addEventListener('pointermove', function (event) {
            if (!dibujando) return;

            puntos.push(obtenerPunto(event));
            actualizarTrazo();
            event.preventDefault();
        });

        canvas.addEventListener('pointerup', terminarTrazo);
        canvas.addEventListener('pointercancel', terminarTrazo);
        canvas.addEventListener('lostpointercapture', terminarTrazo);

        colores.addEventListener('click', function (event) {
            const boton = event.target.closest('button[data-color]');

            if (!boton) return;

            colorActual = boton.dataset.color;

            document.querySelectorAll('.color').forEach(function (colorBoton) {
                colorBoton.classList.toggle(
                    'activo',
                    colorBoton === boton
                );
            });

            activarPincel();
        });

        tamano.addEventListener('input', function () {
            valorGrosor.textContent = tamano.value + ' px';

            if (dibujando) actualizarTrazo();
        });

        nivelOpacidad.addEventListener('input', function () {
            valorOpacidad.textContent = nivelOpacidad.value + '%';

            if (dibujando && !usandoBorrador) {
                actualizarTrazo();
            }
        });

        eraserButton.addEventListener('click', function () {
            usandoBorrador = true;

            eraserButton.style.fontWeight = 'bold';
            pincelButton.style.fontWeight = 'normal';
            canvas.style.cursor = 'cell';
        });

        pincelButton.addEventListener('click', activarPincel);

        pintarTodo.addEventListener('click', function () {
            colorFondo = colorActual;
            actualizarLienzo();
        });

        clearButton.addEventListener('click', function () {
            dibujando = false;
            puntos = [];

            base.clearRect(0, 0, canvas.width, canvas.height);
            trazo.clearRect(0, 0, canvas.width, canvas.height);

            actualizarLienzo();
        });

        actualizarLienzo();
        activarPincel();
    });
    </script>
</body>
</html>
