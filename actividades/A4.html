      .nombre{

      .arriba {
        width: 92%;
        margin: auto;

        height: 50px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        border-bottom: 1px dotted #7897aa;
        }
        
        .arriba nav {
            font-family: 'Courier New', Courier, monospace;
        display: flex;
        gap: 10px;
        }

        .arriba nav a {
        font-size: 15px;

        padding: 5px ;

        transition: .2s;
        text-decoration: none;
        
      }

        .arriba nav a:hover {
        border-bottom: 3px solid #6d9dca;
        }
        a:visited {
        color: rgb(127, 122, 255); /* Cambia el color del enlace visitado */
        text-decoration: none;
        }
        a:hover {
        color: rgb(50, 20, 168); /* Cambia el color del enlace cuando el cursor pasa por encima */
        }
        a:active {
        color: rgb(127, 122, 255); /* Cambia el color del enlace activo (cuando se hace clic) */
        }

        </style> 
  </style>
