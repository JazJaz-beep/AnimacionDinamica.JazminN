<!doctype html>
<html>


<style>
    body{
        background-color: #8fd3cd;
        color: #0057d9;
        text-align: center;
    }
      canvas{
          border: 3px solid #00b8f2;
          background-color: #295cca;
      }




      .nombre{
        color:#0a0099;
      }  
      .arriba {
        width: 92%;
        margin: auto;

        height: 50px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        border-bottom: 1px dotted #280057;
        }
        
        .arriba nav {
            font-family: 'Courier New', Courier, monospace;
        display: flex;
        gap: 10px;
        }

        .arriba nav a {
        font-size: 15px;

        padding: 5px ;

        transition: .2s;
        text-decoration: none;
        text-emphasis-color:#00b8f2;
        color: #00013f;
        
      }

        .arriba nav a:hover {
        border-bottom: 3px solid #0b006b;
        }
        a:visited {
        color: #6abd18; /* Cambia el color del enlace visitado */
        text-decoration: none;
        }
        a:hover {
        color: #00b8f2; /* Cambia el color del enlace cuando el cursor pasa por encima */
        }
        a:active {
        color: #6abd18; /* Cambia el color del enlace activo (cuando se hace clic) */
        }

        </style> 



  <head>
    <meta charset="utf-8">
    <title>sinoidal/coseno </title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <header class="arriba">

            <div class="nombre">
                J N H
            </div>

            <nav>
                 <a href="#" id="inicio" >INICIO</a>
                 <a href="#" id="anterior">ANTERIOR</a>
                <a href="#" id="siguiente" >SIGUIENTE</a>
                
                <a href="#"id="ultimo" >ULTIMO</a>
            </nav>

        </header>
      </br>
    </br>


    <canvas id="canvas" width="1100" height="600"></canvas>
   
   <h1>A3 - Animación con onda sinoidal/coseno</h1> 
    <script src="../js/util.js"></script>
    <script src="../js/pezGlobo.js"></script>
    <script src="../js/navegacion.js"></script>

    <script>
window.onload = function () {

    var canvas = document.getElementById('canvas'),
    context = canvas.getContext('2d'),
    pez = new Pez(),
    angle = 0,
    pulseAngle = 0;

    centerX = canvas.width / 2,
    centerY = canvas.height / 2,
    radiusX = 150,
    radiusY = 100,
    speed = 0.01,
    centerScale = 0.5,
    range = 0.2,
    pulseSpeed = 0.05;

    (function drawFrame () {
    window.requestAnimationFrame(drawFrame, canvas);
    context.clearRect(0, 0, canvas.width, canvas.height);

    // Movimiento ovalado
    pez.x = centerX + Math.sin(angle) * radiusX;
    pez.y = centerY + Math.cos(angle) * radiusY;
    angle += speed;

    // Pulso
    pez.scaleX = pez.scaleY = centerScale + Math.sin(pulseAngle) * range;
    pulseAngle += pulseSpeed;

    pez.draw(context);
  }());

};
    </script>

  </body>
</html>
